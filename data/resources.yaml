# Source of truth for the README. Edit this file, then run:
#   python scripts/build_readme.py
#
# Scores (1-5) — see RANKING.md for the rubric:
#   relevance    how directly it serves someone doing / pursuing FDE work
#   depth        how much real substance it carries
#   practicality how actionable it is (templates, questions, code, steps)
#   authority    first-hand operator or primary source vs. secondhand summary
#   recency      how current it is for the 2025-26 AI-era FDE role
#
# `summary` is extracted from the source itself — keep it one or two lines.

categories:
  - id: understand
    title: "1. Understand the Role"
    blurb: "What an FDE is, where the role came from, and how it differs from SWE, solutions engineering and consulting."
  - id: why-now
    title: "2. Why FDEs Are in Demand Now"
    blurb: "The business case: why AI companies trade margin for moat and hire FDEs at scale."
  - id: field
    title: "3. Doing the Job Well"
    blurb: "Operator writing on how good FDEs actually work in the field."
  - id: interview
    title: "4. Interview Preparation"
    blurb: "Round-by-round guides and question banks. Pair these with the practice set in /interview."
  - id: ai-stack
    title: "5. Technical Stack: Applied AI"
    blurb: "The AI-engineering core most FDE roles now test: agents, evals, RAG, tool use."
  - id: data-systems
    title: "6. Technical Stack: Data, Systems & Integration"
    blurb: "Enterprise data and integration fundamentals — the part of the job that eats most of the calendar."
  - id: soft-stack
    title: "7. The Soft Stack: Discovery, Communication, Consulting"
    blurb: "Customer discovery, structured thinking and trust — what separates FDEs from strong backend engineers."
  - id: roadmaps
    title: "8. Roadmaps & Other Curated Lists"
    blurb: "Other community repos worth knowing, with what each is best for."
  - id: jobs
    title: "9. Jobs, Market Data & Compensation"
    blurb: "Where FDE roles are posted and what the market pays."

